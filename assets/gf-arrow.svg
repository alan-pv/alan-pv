<svg xmlns="http://www.w3.org/2000/svg" width="210" height="110" viewBox="0 0 210 110">
  <style>
    .g { fill: #1a7f37; } .dim { fill: #57606a; }
    @media (prefers-color-scheme: dark) { .g { fill: #3fb950; } .dim { fill: #8b949e; } }
    .lbl { font: 700 24px ui-monospace, 'JetBrains Mono', 'SFMono-Regular', Consolas, 'DejaVu Sans Mono', monospace; }
    .a { fill: none; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; stroke: #1a7f37; }
    @media (prefers-color-scheme: dark) { .a { stroke: #3fb950; } }
  </style>
  <text class="g lbl" x="4" y="96">my gf</text>
  <g>
    <path class="a" d="M92 88 C 140 90, 168 56, 196 14" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1">
      <animate attributeName="stroke-dashoffset" values="1;0" dur="1.1s" begin="0.3s" fill="freeze"/>
    </path>
    <path class="a" d="M181.4 20.6 L196 14 L195.5 30.0" opacity="0">
      <set attributeName="opacity" to="1" begin="1.4s" fill="freeze"/>
    </path>
    <animateTransform attributeName="transform" type="translate" values="0 0;3.3 -5.0;0 0" dur="1.4s" begin="1.5s" repeatCount="indefinite"/>
  </g>
</svg>
